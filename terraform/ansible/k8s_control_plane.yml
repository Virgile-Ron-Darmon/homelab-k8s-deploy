---
# Builds the control plane: kubeadm init on the first control plane node,
# CNI plugin, then any other control plane nodes joined one at a time.
# Safe to rerun: nodes that already belong to the cluster are skipped.
#
# Run after k8s_common.yml, from this folder:
#   ansible-playbook \
#     -i ../inventory/k8s-master_inventory_static.ini \
#     -i ../inventory/k8s-worker_inventory_static.ini \
#     k8s_control_plane.yml

- name: Set up the Kubernetes control plane
  hosts: "{{ k8s_control_plane_hosts | default('k8s-master-*') }}"
  become: true
  order: sorted
  gather_facts: false
  serial: 1

  vars_files:
    - vars/k8s.yml

  vars:
    platform_roles: "{{ playbook_dir }}/roles/homelab-platform/ansible/roles"

  tasks:
    - name: Set up the control plane node
      ansible.builtin.include_role:
        name: "{{ platform_roles }}/k8s/setup/master"

- name: Install Helm on the control plane
  hosts: "{{ k8s_control_plane_hosts | default('k8s-master-*') }}"
  become: true
  gather_facts: false

  vars_files:
    - vars/k8s.yml

  vars:
    platform_roles: "{{ playbook_dir }}/roles/homelab-platform/ansible/roles"

  tasks:
    - name: Install Helm
      ansible.builtin.include_role:
        name: "{{ platform_roles }}/k8s/setup/helm"

- name: Install Multus CNI
  hosts: "{{ k8s_control_plane_hosts | default('k8s-master-*') }}"
  become: true
  order: sorted
  gather_facts: false

  vars_files:
    - vars/k8s.yml

  vars:
    platform_roles: "{{ playbook_dir }}/roles/homelab-platform/ansible/roles"

  tasks:
    - name: Install Multus on {{ k8s_first_cp }}
      when: inventory_hostname == k8s_first_cp
      ansible.builtin.include_role:
        name: "{{ platform_roles }}/k8s/operation/kubectl_apply_daemonset"
      vars:
        component_label: "Multus {{ multus_version }}"
        manifest_url: "{{ multus_manifest_url }}"
        daemonset_name: kube-multus-ds
