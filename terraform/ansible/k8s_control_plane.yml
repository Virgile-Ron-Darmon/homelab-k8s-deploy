---
# Builds the control plane: kubeadm init on the first control plane node,
# Calico as the CNI, then any other control plane nodes joined one at a time.
# Safe to rerun: nodes that already belong to the cluster are skipped.
#
# Run after k8s_common.yml, from this folder:
#   ansible-playbook \
#     -i ../inventory/k8s-master_inventory_static.ini \
#     -i ../inventory/k8s-worker_inventory_static.ini \
#     k8s_control_plane.yml

- name: Set up the Kubernetes control plane
  hosts: "{{ k8s_control_plane_hosts | default('k8s-master-*') }}"
  become: true
  order: sorted
  gather_facts: false
  # One node at a time: the first must finish init before the others join,
  # and etcd members should be added one by one.
  serial: 1

  vars_files:
    - vars/k8s.yml

  tasks:
    - name: Check whether this node is already in the cluster
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: k8s_kubelet_conf

    # First control plane node

    - name: Initialise the cluster on {{ k8s_first_cp }}
      when: inventory_hostname == k8s_first_cp
      environment:
        KUBECONFIG: "{{ k8s_admin_kubeconfig }}"
      block:
        # Pin the control plane to the installed kubeadm. Left unset,
        # kubeadm looks up the latest stable release online.
        - name: Read the installed kubeadm version
          ansible.builtin.command: kubeadm version -o short
          register: k8s_kubeadm_version
          changed_when: false

        - name: Run kubeadm init
          ansible.builtin.command: >-
            kubeadm init
            --kubernetes-version {{ k8s_kubeadm_version.stdout }}
            --control-plane-endpoint {{ k8s_control_plane_endpoint }}
            --apiserver-advertise-address {{ ansible_host }}
            --pod-network-cidr {{ k8s_pod_network_cidr }}
            --cri-socket {{ k8s_cri_socket }}
            --upload-certs
          when: not k8s_kubelet_conf.stat.exists
          changed_when: true

        # The manifest leaves CALICO_IPV4POOL_CIDR unset, so Calico takes
        # the pod CIDR from kubeadm's config. Server-side apply avoids the
        # annotation size limit the large Calico CRDs hit with a plain apply.
        - name: Install Calico {{ calico_version }}
          ansible.builtin.command: >-
            kubectl apply --server-side --force-conflicts
            -f {{ calico_manifest_url }}
          # Server-side apply reports every object whether it changed or not.
          changed_when: false

        - name: Wait for Calico to be ready
          ansible.builtin.command: >-
            kubectl -n kube-system rollout status daemonset/calico-node
            --timeout=300s
          changed_when: false

        - name: Wait until Ready on {{ inventory_hostname }}
          ansible.builtin.command: >-
            kubectl wait --for=condition=Ready node/{{ inventory_hostname }}
            --timeout=300s
          changed_when: false

        # Only needed when there are more control plane nodes to join.
        - name: Upload the control plane certificates for the other nodes
          ansible.builtin.command: kubeadm init phase upload-certs --upload-certs
          register: k8s_upload_certs
          changed_when: true
          no_log: true
          when: ansible_play_hosts_all | length > 1

        - name: Create a join command
          ansible.builtin.command: kubeadm token create --print-join-command
          register: k8s_join_command
          changed_when: true
          no_log: true
          when: ansible_play_hosts_all | length > 1

        - name: Keep the join details for the other control plane nodes
          ansible.builtin.set_fact:
            k8s_cp_join_command: "{{ k8s_join_command.stdout }}"
            k8s_certificate_key: "{{ k8s_upload_certs.stdout_lines | last }}"
          no_log: true
          when: ansible_play_hosts_all | length > 1

    # Other control plane nodes

    - name: Join as a control plane node on {{ inventory_hostname }}
      ansible.builtin.command: >-
        {{ hostvars[k8s_first_cp].k8s_cp_join_command }}
        --control-plane
        --certificate-key {{ hostvars[k8s_first_cp].k8s_certificate_key }}
        --apiserver-advertise-address {{ ansible_host }}
        --cri-socket {{ k8s_cri_socket }}
      when:
        - inventory_hostname != k8s_first_cp
        - not k8s_kubelet_conf.stat.exists
      changed_when: true
      no_log: true

    # kubectl for the SSH user, like the guide's $HOME/.kube/config step

    - name: Look up the SSH user's home directory
      ansible.builtin.getent:
        database: passwd
        key: "{{ ansible_user }}"

    - name: Create ~/.kube for {{ ansible_user }}
      ansible.builtin.file:
        path: "{{ ansible_facts.getent_passwd[ansible_user][4] }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0700"

    - name: Copy the admin kubeconfig for {{ ansible_user }}
      ansible.builtin.copy:
        src: "{{ k8s_admin_kubeconfig }}"
        remote_src: true
        dest: "{{ ansible_facts.getent_passwd[ansible_user][4] }}/.kube/config"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"

- name: Install Helm on the control plane
  hosts: "{{ k8s_control_plane_hosts | default('k8s-master-*') }}"
  become: true
  gather_facts: false

  vars_files:
    - vars/k8s.yml

  tasks:
    - name: Add the Helm repo signing key
      ansible.builtin.get_url:
        url: https://packages.buildkite.com/helm-linux/helm-debian/gpgkey
        dest: /etc/apt/keyrings/helm.asc
        mode: "0644"

    - name: Add the Helm apt repo
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/helm.list
        mode: "0644"
        content: "deb [signed-by=/etc/apt/keyrings/helm.asc] https://packages.buildkite.com/helm-linux/helm-debian/any/ any main\n"

    # The repo holds every Helm release; this keeps apt on helm_minor.
    - name: Limit apt to Helm {{ helm_minor }}
      ansible.builtin.copy:
        dest: /etc/apt/preferences.d/helm
        mode: "0644"
        content: |
          Package: helm
          Pin: version {{ helm_minor }}.*
          Pin-Priority: 1001

    - name: Install Helm
      ansible.builtin.apt:
        name: helm
        update_cache: true