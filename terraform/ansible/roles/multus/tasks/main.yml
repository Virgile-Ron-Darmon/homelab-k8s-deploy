- name: Install Multus CNI
  hosts: "{{ k8s_control_plane_hosts | default('k8s-master-*') }}"
  become: true
  order: sorted
  gather_facts: false

  vars_files:
    - vars/k8s.yml

  tasks:
    - name: Run only on the first control plane node
      when: inventory_hostname == k8s_first_cp
      environment:
        KUBECONFIG: "{{ k8s_admin_kubeconfig }}"
      block:
        - name: Apply the Multus {{ multus_version }} thick plugin manifest
          ansible.builtin.command: >-
            kubectl apply --server-side --force-conflicts
            -f {{ multus_manifest_url }}
          changed_when: false

        - name: Wait for the Multus DaemonSet to be ready
          ansible.builtin.command: >-
            kubectl -n kube-system rollout status daemonset/kube-multus-ds
            --timeout=300s
          changed_when: false